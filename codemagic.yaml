workflows:
  ios-simulator:
    name: Workbench iOS Simulator
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Test API models
        script: |
          set -euo pipefail
          swift test
      - name: Build Workbench
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project Workbench.xcodeproj \
            -scheme Workbench \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild.log
      - name: Package simulator app
        script: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Workbench.app \
            build/Workbench-simulator.app.zip
    artifacts:
      - build/Workbench-simulator.app.zip
      - build/xcodebuild.log

  ios-ipa-ad-hoc:
    name: Workbench iPhone IPA (Ad Hoc signed)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: top.mcdkf.dzz.workbench
    scripts:
      - name: Test API models
        script: |
          set -euo pipefail
          swift test
      - name: Apply signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Build signed iPhone IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project Workbench.xcodeproj \
            --scheme Workbench \
            --config Release
      - name: Verify exported IPA
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import zipfile

          packages = list(Path("build/ios/ipa").glob("*.ipa"))
          if not packages:
              raise SystemExit("No exported IPA found")
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  names = archive.namelist()
                  roots = [name[:-len("Info.plist")] for name in names
                           if name.startswith("Payload/") and name.count("/") == 2
                           and name.endswith(".app/Info.plist")]
                  if len(roots) != 1:
                      raise SystemExit("Expected one iPhone app in Payload")
                  root = roots[0]
                  info = plistlib.loads(archive.read(root + "Info.plist"))
                  if info.get("CFBundleSupportedPlatforms") != ["iPhoneOS"]:
                      raise SystemExit("Expected an iPhoneOS build")
                  if root + "embedded.mobileprovision" not in names:
                      raise SystemExit("Missing provisioning profile")
                  if not any(name.startswith(root + "_CodeSignature/") for name in names):
                      raise SystemExit("Missing app signature")
              print("Exported signed iPhone package:", package)
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-ipa-free:
    name: Workbench iPhone IPA (free sideload)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Test API models
        script: |
          set -euo pipefail
          swift test
      - name: Build iPhone app for local signing
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project Workbench.xcodeproj \
            -scheme Workbench \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            WORKBENCH_APNS_ENABLED=NO \
            WORKBENCH_PUSH_ENTITLEMENTS=Workbench/WorkbenchAppGroup.entitlements \
            2>&1 | tee build/device-build.log
      - name: Package IPA for AltStore signing
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import subprocess

          app = Path("build/DeviceDerivedData/Build/Products/Release-iphoneos/Workbench.app")
          if not app.is_dir():
              raise SystemExit("Device app was not built")
          with (app / "Info.plist").open("rb") as source:
              info = plistlib.load(source)
          if info.get("CFBundleSupportedPlatforms") != ["iPhoneOS"]:
              raise SystemExit("Expected iPhoneOS app")
          executable = app / info["CFBundleExecutable"]
          architectures = subprocess.check_output(["lipo", "-archs", str(executable)], text=True).strip()
          if architectures != "arm64":
              raise SystemExit("Expected arm64 device executable: " + architectures)
          print("Validated device application:", architectures)
          PY
          mkdir -p build/free-install/Payload
          ditto build/DeviceDerivedData/Build/Products/Release-iphoneos/Workbench.app build/free-install/Payload/Workbench.app
          cd build/free-install
          ditto -c -k --keepParent Payload Workbench-unsigned.ipa
          unzip -t Workbench-unsigned.ipa
    artifacts:
      - build/free-install/Workbench-unsigned.ipa
      - build/device-build.log
