# Codemagic CI/CD 配置
# 文档: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/
# 说明: 该项目暂无签名证书，使用模拟器构建（无需签名），可直接验证代码可编译

workflows:
  ios-simulator-build:
    name: iOS Simulator Build (无需签名)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        # 如有需要可在此引入证书组；当前项目无需签名，故留空
    scripts:
      - name: 构建模拟器 App（跳过签名）
        script: |
          xcodebuild \
            -project HelloWorldiOS.xcodeproj \
            -scheme HelloWorldiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$CM_BUILD_DIR/derivedData" \
            clean build
      - name: 定位产物
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/derivedData" -name "HelloWorldiOS.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"
    artifacts:
      - derivedData/**/HelloWorldiOS.app
    publishing:
      scripts:
        - name: 构建完成
          script: echo "✅ iOS 模拟器构建完成，产物已作为 artifact 上传"
